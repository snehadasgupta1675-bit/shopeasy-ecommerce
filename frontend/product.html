<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Product Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">ShopEasy</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>
    </header>

    <main>

        <section id="productContainer" class="product-details">

            <div class="product-image">
                <div class="image-placeholder">
                    Product Image
                </div>
            </div>

            <div class="product-info">

                <h1 id="productName">Loading...</h1>

                <p class="product-category">
                    Category:
                    <span id="productCategory"></span>
                </p>

                <p id="productDescription" class="product-description">
                    Loading product description...
                </p>

                <h2 id="productPrice">₹0</h2>

                <button
                    id="addCartBtn"
                    class="product-btn">
                    Add to Cart
                </button>

                <a href="products.html" class="back-link">
                    ← Back to Products
                </a>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js" defer></script>

</body>
</html>
